services:
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: epay-php
    restart: unless-stopped
    working_dir: /opt/epay
    volumes:
      # Includes plugins and merchant certificates. The image entrypoint
      # prepares their permissions after this bind mount is available.
      - ./:/opt/epay
    ports:
      - "127.0.0.1:9000:9000"
